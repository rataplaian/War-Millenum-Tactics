name: Foundation checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mobile_export:
        type: boolean
        default: false
        description: Run Android and iOS exports
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run export:mobile
        if: github.event_name == 'workflow_dispatch' && inputs.mobile_export
