name: Browser Playtest
on:
  push:
    branches: [main, feature/task-013b-browser-playtest, feature/task-014-unit-tokens-play-ux]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-preview-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true
jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:engine
      - run: npm run export:web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/task-013b-browser-playtest' || github.ref == 'refs/heads/feature/task-014-unit-tokens-play-ux')
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
